name: Diagnose login in Android emulator (temporary)
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/diag-login.yml', '.github/diag/**']
jobs:
  emu:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with: { packages: platform-tools }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build branch APK
        working-directory: room-planner-android
        run: gradle assembleDebug --no-daemon -q && cp app/build/outputs/apk/debug/app-debug.apk ../branch.apk
      - name: Download released APK
        run: curl -sSL -o released.apk https://github.com/pritish-dev/4sinteriors-room-planner/releases/download/apk-latest/RoomPlanner.apk
      - name: Install Playwright
        run: npm i playwright@1.48.2 --no-save
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            .github/diag/try_login.sh released.apk released
            .github/diag/try_login.sh branch.apk branch
