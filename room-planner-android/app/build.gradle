plugins { id 'com.android.application' }
android {
    namespace 'in.foursinteriors.roomplanner'
    compileSdk 34
    defaultConfig {
        applicationId 'in.foursinteriors.roomplanner'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    aaptOptions { noCompress 'js' }
}
